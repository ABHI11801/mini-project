<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Project History</title>
      <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Sigmar&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
         body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8fafc;
         }
         
         .profile-dropdown {
            display: none;
            position: absolute;
            top: 60px;
            right: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            z-index: 10;
         }
         
         .profile-dropdown .dropdown-header, .profile-dropdown .dropdown-item {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
         }
         
         .profile-dropdown .dropdown-header {
            background-color: #f5f5f5;
            border-bottom: 1px solid #e5e5e5;
         }
         
         .profile-dropdown .dropdown-item:hover {
            background-color: #f0f0f0;
         }
         
         .calvin h5 {
            font-family: 'Sigmar', cursive;
            font-size: 1.5rem;
            color: #3b82f6;
         }
         
         .project-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
         }
         
         .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
         }
         
         .new-project-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
         }
         
         .new-project-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
         }
         
         .project-options {
            display: none;
            position: absolute;
            right: 10px;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            z-index: 5;
         }
         
         .project-options .option-item {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
         }
         
         .project-options .option-item:hover {
            background-color: #f0f0f0;
         }
      </style>
   </head>
   <body>
      <div class="relative">
         <div class="profile-section flex justify-between items-center p-4 bg-white shadow-md">
            <div class="calvin">
               <h5 class="text-xl font-bold">WebGen</h5>
            </div>
            <div style="display: flex; align-items: center;">
               <div class="profile-avatar cursor-pointer" onclick="toggleProfileMenu()">
                  <img alt="Profile picture of the logged-in user" class="w-10 h-10 rounded-full" src="https://placehold.co/40x40"/>
               </div>
            </div>
            <!-- Profile Dropdown Menu -->
            <div class="profile-dropdown" id="profileDropdown">
               <div class="dropdown-header flex items-center">
                  <i class="fas fa-user-circle mr-2"></i>
                  <span id="username-display">Loading...</span>
               </div>
               <div class="dropdown-item flex items-center" onclick="window.location.href='profile.html'">
                  <i class="fas fa-user-circle mr-2"></i>
                  <span>Profile</span>
               </div>
               <div class="dropdown-item flex items-center" onclick="window.location.href='aboutus.html'">
                  <i class="fas fa-question-circle mr-2"></i>
                  <span>Help & Support</span>
               </div>
               <div class="dropdown-item flex items-center" id="logoutButton">
                  <i class="fas fa-power-off mr-2"></i>
                  <span>Logout</span>
               </div>
            </div>
         </div>
      </div>
      
      <div class="container mx-auto p-4 max-w-4xl">
         <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Recent Projects</h2>
            <button onclick="createNewProject()" class="new-project-btn px-4 py-2 rounded-lg text-white font-medium flex items-center shadow-md">
               <i class="fas fa-plus mr-2"></i>New Project
            </button>
         </div>
         
         <div class="grid gap-4">
            <!-- Projects will be loaded here dynamically -->
         </div>
         
         <div class="mt-8 bg-blue-50 p-4 rounded-lg shadow-sm">
            <div class="flex items-center">
               <i class="fas fa-lightbulb text-blue-500 mr-3 text-xl"></i>
               <div>
                  <h3 class="font-bold text-gray-800">Quick Tip</h3>
                  <p class="text-gray-600 text-sm">Use project templates to speed up your workflow. Access them when creating a new project.</p>
               </div>
            </div>
         </div>
      </div>

      <script src="/scripts/loginfirst_script.js"></script>
   </body>
</html>
