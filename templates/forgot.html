<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clavin - Forgot Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sigmar&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --background-gradient: linear-gradient(135deg, #6a11cb, #2575fc);
            --button-color: #6a11cb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: var(--background-gradient);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.1);
            z-index: -1;
        }
        .auth-container {
            width: 90%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: #333;
            padding: 30px;
        }
        .calvin-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .calvin-logo h1 {
            font-family: "Sigmar", sans-serif;
            font-size: 3rem;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .auth-button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .auth-links {
            text-align: center;
            margin-top: 20px;
        }
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .instruction-text {
            text-align: center;
            margin-bottom: 25px;
        }
        .error-message {
            color: #ff0000;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .form-step {
            display: none;
        }
        .form-step.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    
    <div class="auth-container">
        <div class="calvin-logo">
            <h1>Clavin</h1>
        </div>
        
        <div class="success-message" id="success-message"></div>
        
        <div class="form-step active" id="step-email">
            <div class="instruction-text">
                <p>Enter your email address and we'll send you a link to reset your password.</p>
            </div>
            <form id="email-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                    <div class="error-message" id="email-error"></div>
                </div>
                <button type="submit" class="auth-button">Send Reset Link</button>
                <div class="auth-links">
                    <a href="login.html">Back to Login</a>
                </div>
            </form>
        </div>

        <div class="form-step" id="step-verify">
            <div class="instruction-text">
                <p>We've sent a verification code to your email. Please enter it below.</p>
            </div>
            <form id="verify-form">
                <div class="form-group">
                    <label for="verification-code">Verification Code</label>
                    <input type="text" id="verification-code" required>
                    <div class="error-message" id="verification-code-error"></div>
                </div>
                <button type="submit" class="auth-button">Verify Code</button>
                <div class="auth-links">
                    <a href="#" id="resend-code">Resend Code</a>
                </div>
            </form>
        </div>

        <div class="form-step" id="step-reset">
            <div class="instruction-text">
                <p>Create a new password for your account.</p>
            </div>
            <form id="reset-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <button type="submit" class="auth-button">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let steps = document.querySelectorAll('.form-step');
            let currentStep = 0;

            function showStep(index) {
                steps.forEach(step => step.classList.remove('active'));
                steps[index].classList.add('active');
            }

            document.getElementById('email-form').addEventListener('submit', function(event) {
                event.preventDefault();
                document.getElementById('email-error').style.display = 'none';
                let email = document.getElementById('email').value;
                if (!email) {
                    document.getElementById('email-error').textContent = 'Email is required';
                    document.getElementById('email-error').style.display = 'block';
                    return;
                }
                showStep(1);
            });

            document.getElementById('verify-form').addEventListener('submit', function(event) {
                event.preventDefault();
                showStep(2);
            });

            document.getElementById('reset-form').addEventListener('submit', function(event) {
                event.preventDefault();
                alert('Password reset successful!');
            });

            showStep(currentStep);
        });
    </script>
</body>
</html>
