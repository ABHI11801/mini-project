<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGen - Forgot Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sigmar&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #7c7f85;
            --background-gradient: linear-gradient(135deg, #070707, #7e8083);
            --button-color: #6a11cb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: var(--background-gradient);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.1);
            z-index: -1;
        }
        .auth-container {
            width: 90%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: #333;
            padding: 30px;
        }
        .calvin-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .calvin-logo h1 {
            font-family: "Sigmar", sans-serif;
            font-size: 3rem;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .auth-button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .auth-links {
            text-align: center;
            margin-top: 20px;
        }
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .instruction-text {
            text-align: center;
            margin-bottom: 25px;
        }
        .error-message {
            color: #ff0000;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .form-step {
            display: none;
        }
        .form-step.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    
    <div class="auth-container">
        <div class="calvin-logo">
            <h1>WebGen</h1>
        </div>
        
        <div class="success-message" id="success-message"></div>
        
        <div class="form-step active" id="step-email">
            <div class="instruction-text">
                <p>Enter your email address and we'll send you a link to reset your password.</p>
            </div>
            <form id="email-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                    <div class="error-message" id="email-error"></div>
                </div>
                <button type="submit" class="auth-button">Send Reset Link</button>
                <div class="auth-links">
                    <a href="login.html">Back to Login</a>
                </div>
            </form>
        </div>

        <div class="form-step" id="step-verify">
            <div class="instruction-text">
                <p>We've sent a verification code to your email. Please enter it below.</p>
                <p>Code expires in: <span id="countdown">10:00</span></p>
            </div>
            <form id="verify-form">
                <div class="form-group">
                    <label for="verification-code">Verification Code</label>
                    <input type="text" id="verification-code" required>
                    <div class="error-message" id="verification-code-error"></div>
                </div>
                <button type="submit" class="auth-button">Verify Code</button>
                <div class="auth-links">
                    <a href="#" id="resend-code">Resend Code</a>
                </div>
            </form>
        </div>

        <div class="form-step" id="step-reset">
            <div class="instruction-text">
                <p>Create a new password for your account.</p>
            </div>
            <form id="reset-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <button type="submit" class="auth-button">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let steps = document.querySelectorAll('.form-step');
            let currentStep = 0;
            let countdownInterval;
            let timeLeft = 600; // 10 minutes in seconds

            function updateCountdown() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('countdown').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdown').textContent = 'EXPIRED';
                    document.getElementById('verification-code-error').textContent = 'Code has expired. Please request a new one.';
                    document.getElementById('verification-code-error').style.display = 'block';
                }
                timeLeft--;
            }

            function startCountdown() {
                timeLeft = 600; // Reset to 10 minutes
                clearInterval(countdownInterval);
                countdownInterval = setInterval(updateCountdown, 1000);
            }

            function showStep(index) {
                steps.forEach(step => step.classList.remove('active'));
                steps[index].classList.add('active');
                
                if (index === 1) { // Verification step
                    startCountdown();
                } else {
                    clearInterval(countdownInterval);
                }
            }

            // Add resend code functionality
            document.getElementById('resend-code').addEventListener('click', async function(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const errorElement = document.getElementById('verification-code-error');
                
                try {
                    const response = await fetch('http://localhost:5500/api/generate-code', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ user_email: email })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        startCountdown(); // Reset the countdown
                        errorElement.style.display = 'none';
                    } else {
                        errorElement.textContent = data.message || 'Failed to resend code';
                        errorElement.style.display = 'block';
                    }
                } catch (error) {
                    errorElement.textContent = 'An error occurred. Please try again.';
                    errorElement.style.display = 'block';
                }
            });

            document.getElementById('email-form').addEventListener('submit', async function(event) {
                event.preventDefault();
                const errorElement = document.getElementById('email-error');
                const successMessage = document.getElementById('success-message');
                const email = document.getElementById('email').value;
                
                // Clear previous messages
                errorElement.style.display = 'none';
                successMessage.style.display = 'none';
                
                try {
                    // First check if email exists
                    const checkResponse = await fetch('http://localhost:5500/api/check-email', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ user_email: email })
                    });

                    const checkData = await checkResponse.json();

                    if (checkResponse.ok) {
                        // Generate verification code
                        const codeResponse = await fetch('http://localhost:5500/api/generate-code', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ user_email: email })
                        });

                        const codeData = await codeResponse.json();
                        
                        if (codeResponse.ok) {
                            // Show success message without the code
                            successMessage.textContent = 'Verification code has been sent to your email. Please check your inbox.';
                            successMessage.style.display = 'block';
                            showStep(1);
                        } else {
                            errorElement.textContent = 'Failed to generate verification code';
                            errorElement.style.display = 'block';
                        }
                    } else {
                        errorElement.textContent = checkData.message || 'This email is not registered in our system.';
                        errorElement.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Error details:', error);
                    errorElement.textContent = 'An error occurred. Please try again.';
                    errorElement.style.display = 'block';
                }
            });

            document.getElementById('verify-form').addEventListener('submit', async function(event) {
                event.preventDefault();
                const errorElement = document.getElementById('verification-code-error');
                const code = document.getElementById('verification-code').value;
                const email = document.getElementById('email').value;
                
                try {
                    const response = await fetch('http://localhost:5500/api/verify-code', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ user_email: email, code })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showStep(2);
                    } else {
                        errorElement.textContent = data.message || 'Invalid verification code';
                        errorElement.style.display = 'block';
                    }
                } catch (error) {
                    errorElement.textContent = 'An error occurred. Please try again.';
                    errorElement.style.display = 'block';
                }
            });

            document.getElementById('reset-form').addEventListener('submit', async function(event) {
                event.preventDefault();
                
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const email = document.getElementById('email').value;
                const code = document.getElementById('verification-code').value;
                
                if (newPassword !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }
                
                // Show loading state
                const submitButton = this.querySelector('button[type="submit"]');
                const originalButtonText = submitButton.textContent;
                submitButton.textContent = 'Resetting Password...';
                submitButton.disabled = true;
                
                try {
                    const response = await fetch('http://localhost:5500/api/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            user_email: email,
                            code: code,
                            new_password: newPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Show success message
                        const successMessage = document.getElementById('success-message');
                        successMessage.textContent = 'Password reset successful! Redirecting to login page...';
                        successMessage.style.display = 'block';
                        
                        // Redirect to login page after a short delay
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        alert(data.message || 'Failed to reset password. Please try again.');
                        submitButton.textContent = originalButtonText;
                        submitButton.disabled = false;
                    }
                } catch (error) {
                    alert('An error occurred. Please try again later.');
                    submitButton.textContent = originalButtonText;
                    submitButton.disabled = false;
                }
            });

            showStep(currentStep);
        });
    </script>
</body>
</html>
